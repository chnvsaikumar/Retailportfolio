<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Listing maker – ChannelHaat</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#F5F7FA;color:#222;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
main{max-width:860px;margin:0 auto}h1{margin:0 0 6px;font-size:28px}p.s{color:#8A8F98;margin:0 0 20px}
.box{background:#fff;border:1px solid #E6E9EF;border-radius:14px;padding:18px;margin-bottom:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:grid;gap:4px;font-size:13px;color:#8A8F98}
input,select,textarea{width:100%;padding:10px;border:1px solid #E6E9EF;border-radius:8px;font:inherit;color:#222;background:#fff}
textarea{min-height:90px}.w{grid-column:1/-1}
button{border:0;border-radius:8px;padding:11px 18px;font:700 15px system-ui;background:#2952FF;color:#fff;cursor:pointer}button.a{background:#EEF2FF;color:#222}
.r{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}#msg{color:#1F9416;font-weight:700;margin:10px 0 0}
pre{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px;overflow:auto;max-height:340px;font-size:13px;margin:0}
.p{width:160px;height:100px;border-radius:10px;background:#E6E9EF center/cover;margin-top:8px}
</style></head><body><main>
<h1>Listing maker</h1><p class="s">Fill in the channel details. Then copy the result into <b>listings.json</b> on GitHub.</p>
<div class="box"><div class="g">
<label>Channel name *<input id="name"></label>
<label>YouTube channel link<input id="link" placeholder="https://www.youtube.com/channel/UC..."></label>
<label>Subscribers<input id="subs" type="number"></label>
<label>Lifetime views<input id="views" type="number"></label>
<label>Number of videos<input id="videos" type="number"></label>
<label>Year created<input id="created" placeholder="2021"></label>
<label>Price in ₹<input id="price" type="number"></label>
<label>Monthly revenue<input id="revenue" placeholder="Nil, ₹5K–10K / mo"></label>
<label>Monetized<select id="monetized"><option value="yes">Yes</option><option value="no">No</option></select></label>
<label>Niche<select id="niche"><option>Entertainment</option><option>Gaming</option><option>Comedy</option><option>Education</option><option>Music</option><option>News</option><option>Kids</option><option>Vlog</option><option>Tech</option><option>Finance</option><option>Animation</option><option>Movies</option><option>Cooking</option></select></label>
<label>Language<input id="language" value="HI"></label>
<label>Recommended badge<select id="rec"><option value="">No</option><option value="1">Yes</option></select></label>
<label class="w">Description<textarea id="description"></textarea></label>
<label>Channel image: upload a file<input id="file" type="file" accept="image/*"></label>
<label>Or paste an image link<input id="imgurl" placeholder="https://..."></label>
<div class="w"><div class="p" id="prev"></div><p class="s" id="imgnote" style="margin:6px 0 0"></p></div>
</div>
<div class="r"><button type="button" id="dl" class="a">Save resized image</button></div></div>
<div class="box"><label>Paste your current listings.json here (leave empty to start a new one)<textarea id="old" placeholder='{ "listings": [ ... ] }'></textarea></label>
<div class="r"><button type="button" id="make">Make listings.json</button><button type="button" id="copy" class="a">Copy</button><button type="button" id="save" class="a">Download file</button></div>
<p id="msg" role="status"></p></div>
<pre id="out">Your listings.json will appear here.</pre>
</main>
<script>
const $=i=>document.getElementById(i);let imgData="",imgName="";
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"channel";
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,800/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);imgData=c.toDataURL("image/jpeg",.82);$("prev").style.backgroundImage="url("+imgData+")";note()};im.src=URL.createObjectURL(f)};
$("imgurl").oninput=()=>{$("prev").style.backgroundImage=$("imgurl").value?"url("+$("imgurl").value+")":"";note()};
$("name").oninput=note;
function note(){imgName="images/"+slug($("name").value)+".jpg";$("imgnote").textContent=imgData?"Click “Save resized image”, then upload it to the images folder in your GitHub repo. The listing will use "+imgName:""}
$("dl").onclick=()=>{if(!imgData){$("msg").textContent="Choose an image file first.";return}const a=document.createElement("a");a.href=imgData;a.download=slug($("name").value)+".jpg";a.click()};
$("make").onclick=()=>{const name=$("name").value.trim();if(!name){$("msg").textContent="Channel name is required.";return}
 let cur={listings:[]};const t=$("old").value.trim();
 if(t){try{const j=JSON.parse(t);cur=Array.isArray(j)?{listings:j}:j;cur.listings=cur.listings||[]}catch(e){$("msg").textContent="The pasted listings.json has a mistake. Paste the whole file again, or clear the box.";return}}
 const n=v=>v===""?undefined:+v,o={name,link:$("link").value.trim()||undefined,image:imgData?imgName:($("imgurl").value.trim()||undefined),subs:n($("subs").value),views:n($("views").value),videos:n($("videos").value),created:$("created").value.trim()||undefined,price:n($("price").value),monetized:$("monetized").value,niche:$("niche").value,language:$("language").value.trim()||undefined,revenue:$("revenue").value.trim()||undefined,recommended:!!$("rec").value,description:$("description").value.trim()||undefined};
 cur.listings.unshift(JSON.parse(JSON.stringify(o)));$("out").textContent=JSON.stringify(cur,null,2);$("msg").textContent="Done. Copy it, then replace everything in listings.json on GitHub.";};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("out").textContent);$("msg").textContent="Copied."}catch(e){$("msg").textContent="Select the text and copy it manually."}};
$("save").onclick=()=>{const b=new Blob([$("out").textContent],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="listings.json";a.click()};
</script></body></html>
